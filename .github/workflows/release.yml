name: Release

on:
  push:
    tags:
      - "v*"
    # Cache-Lauf: Tags lesen nur Caches von master, darum dort bauen, sobald sich Abhaengigkeiten aendern
    branches:
      - master
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - .github/workflows/*.yml
  # Caches verfallen nach 7 Tagen ohne Zugriff, neue Rust-Version macht sie ungueltig
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

# Neuer Cache-Lauf ersetzt den alten; Tag-Runs laufen immer zu Ende
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  # Tests parallel zum Build statt davor: rot = Run rot, Draft nicht veroeffentlichen.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ""
          - os: macos-latest
            name: macos-aarch64
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            name: macos-x86_64
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            name: linux
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags fuer den Changelog
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Linux-Abhaengigkeiten
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-aarch64' && 'aarch64-apple-darwin' || matrix.name == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}
      # Nur master speichert: ein Tag-Cache waere fuer den naechsten Tag unsichtbar.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Changelog: Stichpunkte der feat/fix-Commits seit dem letzten Tag
      - name: Changelog
        id: notes
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo 'body<<NOTES_EOF'
            git log ${prev:+$prev..}"$GITHUB_REF_NAME" --no-merges -E --grep='^(feat|fix)' --format=%b \
              | grep -E '^(- |  )' | grep -vE '^- Version [0-9]' || true
            echo NOTES_EOF
          } >> "$GITHUB_OUTPUT"

      # WPF-Vorschau: der C#-Helfer liegt nur im Windows-Bundle (tauri.windows.conf.json erwartet ihn in publish/)
      - uses: actions/setup-dotnet@v6
        if: matrix.name == 'windows'
        with:
          dotnet-version: 8.0.x
      - name: XAML-Helfer
        if: matrix.name == 'windows'
        run: dotnet publish src-tauri/xaml-preview -c Release -o src-tauri/xaml-preview/publish

      - uses: tauri-apps/tauri-action@v0
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Open Claude __VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - uses: tauri-apps/tauri-action@v0
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          args: ${{ matrix.args }}

      # Cache-Laeufe brauchen keine Installer
      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          name: bundles-${{ matrix.name }}
          # nur die Installer, nicht das entpackte AppDir
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
