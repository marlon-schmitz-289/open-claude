[package]
name = "ocui"
version = "1.0.1"
description = "Projekt-Launcher fuer Claude Code"
authors = ["Marlon Schmitz"]
edition = "2021"
default-run = "ocui"

[lib]
name = "ocui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
portable-pty = "0.9"
# nur fuer die eigene Shell (src/bin/ocui-sh.rs)
reedline = "0.49"
ctrlc = "3"
# native-tls = SChannel: nutzt den Windows-Zertifikatsspeicher (Firmen-Root-CA hinter Proxy)
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls", "charset", "http2", "system-proxy"] }
base64 = "0.23.1"

# keyring ohne Plattform-Feature haelt den Token nur im RAM, darum je Ziel ein echter Speicher
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Secret Service (GNOME-Keyring/KWallet) ueberlebt Neustarts, keyutils allein nicht
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
